name: Postman Collection Wokflow

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
     - cron: 30 03 * * * # 9 AM IST 
     - cron: 00 14 * * * # 7:30 PM IST
     - cron: 00 06 * * 1-5 # monday to friday 

jobs:
    run-postman-tests:
      runs-on: guru-ec2-github-runner
      
      steps:
        - name : checkout the code
          uses : actions/checkout@v5.1.0

        - name: Install NodeJs and npm
          uses: actions/setup-node@v6.5.0
          with:
            node-version: '22'

        - name: Install Newman and Html extra globally
          run: |
                npm install -g newman
                npm install -g newman-reporter-htmlextra

        - name: Run the postman collection using newman
          run: |
                newman run 'InWarrentyFlowCollection With Newman CLI.postman_collection.json' \
                -e QA.postman_environment.json \
                -d testdata.csv \
                -r cli,htmlextra \
                --reporter-htmlextra-export ./newman/index.html
                
        - name: Archieve Newman Reports
          if: always()
          uses: actions/upload-artifact@v7.0.1
          with:
            name: newman-reports-html
            path: newman/*.html

        - name: Creating github page branch
          if: always()
          uses: peaceiris/actions-gh-pages@v4.1.0
          with:
            github_token: ${{ secrets.GITHUB_TOKEN}}
            publish_dir: newman/

        - name: Send Email
          if: always()
          uses: dawidd6/action-send-mail@v18
          with:
            server_address: smtp.gmail.com
            server_port: '465'
            username: ${{ secrets.EMAIL_USERNAME }}
            password: ${{ secrets.EMAIL_PASSWORD }}
            subject: Phoenix Inwarranty Flow Test execution Notification
            to: umbarkargurudatta26@gmail.com
            from: ${{ secrets.EMAIL_USERNAME }}
            body: |
                   Hi,
                   Phoenix Inwarranty Flow Postman Api execution has been executed. The reports has been generated and the
                   url is : https://guru2026-eng.github.io/Phoenix-Inwarranty-Flow/
            
           
